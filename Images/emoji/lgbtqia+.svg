<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="LGBTQIA+ inclusive flag icon with plus">
  <!-- Transparent background, inclusive flag with plus symbol -->
  <g transform="translate(8 10)">
    <rect x="10" y="4" width="44" height="36" rx="6" ry="6" fill="#020617"/>
    <rect x="12" y="6" width="40" height="5" fill="#E40303"/>
    <rect x="12" y="11" width="40" height="5" fill="#FF8C00"/>
    <rect x="12" y="16" width="40" height="5" fill="#FFED00"/>
    <rect x="12" y="21" width="40" height="5" fill="#008026"/>
    <rect x="12" y="26" width="40" height="5" fill="#004DFF"/>
    <rect x="12" y="31" width="40" height="5" fill="#750787"/>
    <!-- small plus sign in corner for "+" -->
    <rect x="38" y="10" width="8" height="2" rx="1" ry="1" fill="#f9fafb"/>
    <rect x="41" y="7" width="2" height="8" rx="1" ry="1" fill="#f9fafb"/>
  </g>
</svg>

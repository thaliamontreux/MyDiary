<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="LGBT artist brush with rainbow stroke">
  <!-- Transparent background, paintbrush with rainbow stroke -->
  <g transform="translate(24 36)">
    <!-- stroke -->
    <path d="M-8 4 C0 0 8 0 16 -4" fill="none" stroke="#E40303" stroke-width="3" stroke-linecap="round"/>
    <path d="M-8 7 C0 3 8 3 16 -1" fill="none" stroke="#22c55e" stroke-width="3" stroke-linecap="round"/>
  </g>
  <g transform="translate(40 24) rotate(-40)">
    <!-- brush handle -->
    <rect x="-8" y="-2" width="16" height="4" rx="2" ry="2" fill="#0f172a"/>
    <!-- bristles -->
    <path d="M8,-3 L12,0 8,3 Z" fill="#f97316"/>
  </g>
</svg>

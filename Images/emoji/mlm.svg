<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="MLM interlocking mars symbols">
  <!-- Transparent background, two interlocking Mars symbols -->
  <g transform="translate(32 32)">
    <circle cx="-5" cy="-2" r="5" fill="none" stroke="#22c55e" stroke-width="2.4"/>
    <circle cx="5" cy="-2" r="5" fill="none" stroke="#3b82f6" stroke-width="2.4"/>
    <!-- left arrow -->
    <line x1="-1" y1="-8" x2="-6" y2="-13" stroke="#22c55e" stroke-width="2.4" stroke-linecap="round"/>
    <line x1="-8" y1="-12" x2="-4" y2="-16" stroke="#22c55e" stroke-width="2.4" stroke-linecap="round"/>
    <!-- right arrow -->
    <line x1="1" y1="-8" x2="6" y2="-13" stroke="#3b82f6" stroke-width="2.4" stroke-linecap="round"/>
    <line x1="4" y1="-16" x2="8" y2="-12" stroke="#3b82f6" stroke-width="2.4" stroke-linecap="round"/>
  </g>
</svg>

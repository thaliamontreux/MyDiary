<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Family rejection figure outside house">
  <!-- Transparent background, small house and figure turned away -->
  <g transform="translate(26 34)">
    <!-- house -->
    <polygon points="0,-10 8,-4 -8,-4" fill="#111827"/>
    <rect x="-7" y="-4" width="14" height="10" rx="2" ry="2" fill="#020617"/>
    <rect x="-2" y="-1" width="4" height="7" fill="#1f2937"/>
  </g>
  <g transform="translate(44 36)">
    <!-- figure looking away -->
    <circle cx="0" cy="-7" r="2.6" fill="#e5e7eb"/>
    <path d="M-2 -3 C-1 -6 1 -6 2 -3 L2 5 L-2 5 Z" fill="#111827"/>
    <line x1="-3" y1="0" x2="-6" y2="-1" stroke="#111827" stroke-width="1.4" stroke-linecap="round"/>
  </g>
</svg>

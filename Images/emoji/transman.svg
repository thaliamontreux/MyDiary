<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Trans man symbol with trans flag">
  <!-- Transparent background, trans flag inside mars symbol -->
  <g transform="translate(32 32)">
    <!-- circle -->
    <circle cx="0" cy="0" r="12" fill="#0f172a"/>
    <circle cx="0" cy="0" r="9" fill="#ffffff"/>
    <!-- trans stripes inside circle -->
    <rect x="-8" y="-7" width="16" height="3" fill="#5BCEFA"/>
    <rect x="-8" y="-4" width="16" height="3" fill="#F5A9B8"/>
    <rect x="-8" y="-1" width="16" height="3" fill="#ffffff"/>
    <rect x="-8" y="2" width="16" height="3" fill="#F5A9B8"/>
    <rect x="-8" y="5" width="16" height="3" fill="#5BCEFA"/>
    <!-- arrow for mars symbol -->
    <line x1="8" y1="-8" x2="16" y2="-16" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
    <line x1="13" y1="-17" x2="17" y2="-13" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>

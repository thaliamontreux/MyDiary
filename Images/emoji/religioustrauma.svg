<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Religious trauma cracked symbol">
  <!-- Transparent background, cracked simple cross with tear -->
  <g transform="translate(30 30)">
    <rect x="-2" y="-10" width="4" height="16" fill="#111827"/>
    <rect x="-6" y="-6" width="12" height="3" fill="#111827"/>
    <!-- crack -->
    <path d="M-1 -10 L1 -6 L-1 -2 L1 2" fill="none" stroke="#f97316" stroke-width="1.4"/>
  </g>
  <!-- tear -->
  <g transform="translate(40 40)">
    <path d="M0 -3 C1 -1 2 0 2 1.3 C2 2.7 1.1 3.5 0 3.5 C-1.1 3.5 -2 2.7 -2 1.3 C-2 0  -1 -1 0 -3 Z" fill="#38bdf8"/>
  </g>
</svg>

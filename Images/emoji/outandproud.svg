<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Out and proud megaphone with rainbow sound">
  <!-- Transparent background, megaphone with rainbow arcs -->
  <g transform="translate(24 34)">
    <!-- megaphone body -->
    <polygon points="0,-6 10,-10 12,-2 2,2" fill="#0f172a"/>
    <rect x="-4" y="-2" width="4" height="8" rx="2" ry="2" fill="#111827"/>
  </g>
  <!-- rainbow sound waves -->
  <g transform="translate(36 30)">
    <path d="M2 -4 A8 8 0 0 1 2 4" fill="none" stroke="#E40303" stroke-width="2" stroke-linecap="round"/>
    <path d="M6 -6 A11 11 0 0 1 6 6" fill="none" stroke="#FF8C00" stroke-width="2" stroke-linecap="round"/>
    <path d="M10 -8 A14 14 0 0 1 10 8" fill="none" stroke="#22c55e" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>

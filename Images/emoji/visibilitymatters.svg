    <path d="M-18 0 C-12 -10 -4 -14 0 -14 C4 -14 12 -10 18 0 C12 10 4 14 0 14 C-4 14 -12 10 -18 0 Z" fill="#0f172a"/>
    <path d="M-14 0 C-9 -7 -3 -10 0 -10 C3 -10 9 -7 14 0 C9 7 3 10 0 10 C-3 10 -9 7 -14 0 Z" fill="#020617"/>
    <!-- iris -->
    <circle cx="0" cy="0" r="5.5" fill="#111827"/>
    <circle cx="0" cy="0" r="5" fill="#E40303"/>
    <path d="M0 -5 A5 5 0 0 1 4.33 -2.5 L0 0 Z" fill="#FF8C00"/>
    <path d="M4.33 -2.5 A5 5 0 0 1 4.33 2.5 L0 0 Z" fill="#FFED00"/>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Closeted closed door with tiny rainbow keyhole">
  <!-- Transparent background, closed door with tiny rainbow keyhole -->
  <g transform="translate(32 34)">
    <rect x="-8" y="-12" width="16" height="22" rx="2" ry="2" fill="#111827"/>
    <rect x="-7" y="-11" width="14" height="20" fill="#020617"/>
    <!-- small keyhole circle with rainbow fill -->
    <defs>
      <linearGradient id="closet-rainbow" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#E40303"/>
        <stop offset="50%" stop-color="#FFED00"/>
        <stop offset="100%" stop-color="#3b82f6"/>
      </linearGradient>
    </defs>
    <circle cx="4" cy="0" r="1.4" fill="url(#closet-rainbow)"/>
  </g>
</svg>

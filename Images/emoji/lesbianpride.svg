<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Lesbian pride flag with sparkle">
  <!-- Transparent background, lesbian flag card with sparkle -->
  <g transform="translate(10 18)">
    <rect x="0" y="0" width="32" height="24" rx="5" ry="5" fill="#020617"/>
    <rect x="2" y="2" width="28" height="3" fill="#D62800"/>
    <rect x="2" y="5" width="28" height="3" fill="#FF9B56"/>
    <rect x="2" y="8" width="28" height="3" fill="#FFB87A"/>
    <rect x="2" y="11" width="28" height="3" fill="#ffffff"/>
    <rect x="2" y="14" width="28" height="3" fill="#D462A6"/>
    <rect x="2" y="17" width="28" height="3" fill="#A40062"/>
    <rect x="2" y="20" width="28" height="3" fill="#680039"/>
  </g>
  <!-- sparkle -->
  <g transform="translate(42 18)">
    <path d="M0,-4 L1,0 0,4 -1,0 Z" fill="#f97316"/>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Queer history book with bookmark">
  <!-- Transparent background, closed book with small rainbow bookmark -->
  <g transform="translate(28 32)">
    <rect x="-10" y="-10" width="20" height="24" rx="2" ry="2" fill="#020617"/>
    <rect x="-9" y="-8" width="18" height="20" fill="#0f172a"/>
    <!-- bookmark -->
    <polygon points="8,-8 12,-8 12,0 10,-2 8,0" fill="#E40303"/>
    <!-- small rainbow stripe on spine -->
    <rect x="-10" y="-10" width="2" height="24" fill="#E40303"/>
    <rect x="-8" y="-10" width="2" height="24" fill="#22c55e"/>
  </g>
</svg>

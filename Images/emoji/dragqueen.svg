<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Drag queen crown and lashes">
  <!-- Transparent background, little crown and lashes -->
  <g transform="translate(32 24)">
    <!-- crown -->
    <path d="M-10 4 L-6 -4 L0 2 L6 -4 L10 4 Z" fill="#facc15"/>
    <circle cx="-6" cy="-4" r="1.5" fill="#f97316"/>
    <circle cx="0" cy="0" r="1.7" fill="#f97316"/>
    <circle cx="6" cy="-4" r="1.5" fill="#f97316"/>
  </g>
  <!-- lashes -->
  <g transform="translate(32 38)">
    <path d="M-8 0 C-4 2 4 2 8 0" fill="none" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
    <line x1="-6" y1="0" x2="-7" y2="-3" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="0" y1="1" x2="0" y2="-3" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="6" y1="0" x2="7" y2="-3" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round"/>
  </g>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Demisexual pride flag icon">
  <!-- Transparent background, demi pride flag card -->
  <g transform="translate(10 14)">
    <rect x="0" y="0" width="44" height="32" rx="6" ry="6" fill="#ffffff"/>
    <!-- horizontal stripes -->
    <rect x="2" y="2" width="40" height="8" fill="#A3A3A3"/>
    <rect x="2" y="22" width="40" height="8" fill="#800080"/>
    <!-- black triangle on the left -->
    <polygon points="2,2 18,16 2,30" fill="#000000"/>
  </g>
</svg>

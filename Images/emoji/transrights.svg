<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Trans rights scales of justice">
  <!-- Transparent background, justice scales in trans flag colors -->
  <g transform="translate(32 36)">
    <!-- pole -->
    <line x1="0" y1="-14" x2="0" y2="10" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
    <line x1="-12" y1="-10" x2="12" y2="-10" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
    <!-- trans stripe on beam -->
    <rect x="-12" y="-12" width="24" height="2" fill="#5BCEFA"/>
    <!-- pans -->
    <circle cx="-10" cy="0" r="6" fill="#F5A9B8" fill-opacity="0.9"/>
    <circle cx="10" cy="0" r="6" fill="#5BCEFA" fill-opacity="0.9"/>
    <!-- base -->
    <rect x="-8" y="8" width="16" height="4" rx="2" fill="#0f172a"/>
  </g>
</svg>

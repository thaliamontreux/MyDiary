<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Housing discrimination house and barred door">
  <!-- Transparent background, house with barred door -->
  <g transform="translate(32 32)">
    <polygon points="0,-10 10,-2 -10,-2" fill="#111827"/>
    <rect x="-9" y="-2" width="18" height="12" rx="2" ry="2" fill="#020617"/>
    <!-- barred door -->
    <rect x="-2" y="0" width="4" height="8" fill="#111827"/>
    <rect x="-1.5" y="0" width="1" height="8" fill="#e5e7eb"/>
    <rect x="-0.2" y="0" width="1" height="8" fill="#e5e7eb"/>
  </g>
</svg>

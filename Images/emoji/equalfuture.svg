<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Equal future sunrise and equal sign">
  <!-- Transparent background, sunrise over horizon with equal sign -->
  <g transform="translate(30 34)">
    <rect x="-10" y="2" width="20" height="3" fill="#111827"/>
  </g>
  <g transform="translate(30 28)">
    <circle cx="0" cy="2" r="4" fill="#facc15"/>
    <line x1="-6" y1="2" x2="6" y2="2" stroke="#fbbf24" stroke-width="1.4" stroke-linecap="round"/>
  </g>
  <g transform="translate(44 30)">
    <rect x="-3" y="-2" width="6" height="1.6" rx="0.8" ry="0.8" fill="#e5e7eb"/>
    <rect x="-3" y="1" width="6" height="1.6" rx="0.8" ry="0.8" fill="#e5e7eb"/>
  </g>
</svg>

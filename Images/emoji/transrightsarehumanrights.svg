<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Trans rights are human rights sign">
  <!-- Transparent background, protest sign with trans stripes -->
  <g transform="translate(32 36)">
    <!-- pole -->
    <rect x="-1.5" y="-6" width="3" height="16" fill="#0f172a"/>
  </g>
  <g transform="translate(32 22)">
    <!-- sign board with trans stripes -->
    <rect x="-10" y="-6" width="20" height="12" rx="2" ry="2" fill="#ffffff"/>
    <rect x="-9" y="-5" width="18" height="2" fill="#5BCEFA"/>
    <rect x="-9" y="-3" width="18" height="2" fill="#F5A9B8"/>
    <rect x="-9" y="-1" width="18" height="2" fill="#ffffff"/>
    <rect x="-9" y="1" width="18" height="2" fill="#F5A9B8"/>
    <rect x="-9" y="3" width="18" height="2" fill="#5BCEFA"/>
  </g>
</svg>

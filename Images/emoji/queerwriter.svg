<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Queer writer pen over page">
  <!-- Transparent background, fountain pen over small page -->
  <g transform="translate(20 28)">
    <rect x="0" y="0" width="20" height="26" rx="3" ry="3" fill="#020617"/>
    <line x1="4" y1="6" x2="16" y2="6" stroke="#e5e7eb" stroke-width="1.2"/>
    <line x1="4" y1="11" x2="16" y2="11" stroke="#e5e7eb" stroke-width="1.2"/>
    <line x1="4" y1="16" x2="14" y2="16" stroke="#e5e7eb" stroke-width="1.2"/>
  </g>
  <g transform="translate(38 30) rotate(-30)">
    <!-- pen barrel -->
    <rect x="-8" y="-2" width="16" height="4" rx="2" ry="2" fill="#4f46e5"/>
    <!-- nib -->
    <polygon points="8,-2 12,0 8,2" fill="#facc15"/>
  </g>
</svg>

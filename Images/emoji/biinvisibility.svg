<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Bi invisibility fading bi flag">
  <!-- Transparent background, bi flag card fading to the right -->
  <g transform="translate(32 34)">
    <defs>
      <linearGradient id="bi-fade" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#D60270" stop-opacity="1"/>
        <stop offset="100%" stop-color="#D60270" stop-opacity="0"/>
      </linearGradient>
    </defs>
    <rect x="-12" y="-8" width="24" height="16" rx="3" ry="3" fill="#020617"/>
    <rect x="-10" y="-7" width="20" height="6" fill="url(#bi-fade)"/>
    <rect x="-10" y="-1" width="20" height="4" fill="#9B4F96" fill-opacity="0.7"/>
    <rect x="-10" y="3" width="20" height="6" fill="#0038A8" fill-opacity="0.7"/>
  </g>
</svg>

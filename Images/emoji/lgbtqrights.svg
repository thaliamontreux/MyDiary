<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="LGBTQ rights scales over rainbow bar">
  <!-- Transparent background, scales over rainbow bar -->
  <g transform="translate(32 34)">
    <!-- rainbow bar -->
    <rect x="-12" y="8" width="24" height="3" fill="#E40303"/>
    <rect x="-12" y="11" width="24" height="3" fill="#22c55e"/>
    <!-- scales -->
    <line x1="0" y1="-10" x2="0" y2="4" stroke="#0f172a" stroke-width="2.6" stroke-linecap="round"/>
    <line x1="-10" y1="-6" x2="10" y2="-6" stroke="#0f172a" stroke-width="2.4" stroke-linecap="round"/>
    <circle cx="-8" cy="0" r="4" fill="none" stroke="#0f172a" stroke-width="2"/>
    <circle cx="8" cy="0" r="4" fill="none" stroke="#0f172a" stroke-width="2"/>
  </g>
</svg>

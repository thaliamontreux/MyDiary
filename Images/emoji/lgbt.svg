<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="LGBT rainbow flag icon">
  <!-- Transparent background, just a centered 6-stripe rainbow flag card -->
  <g transform="translate(10 12)">
    <rect x="0" y="0" width="44" height="40" rx="6" ry="6" fill="#000" fill-opacity="0.16"/>
    <rect x="2" y="2" width="40" height="6" fill="#E40303"/>
    <rect x="2" y="8" width="40" height="6" fill="#FF8C00"/>
    <rect x="2" y="14" width="40" height="6" fill="#FFED00"/>
    <rect x="2" y="20" width="40" height="6" fill="#008026"/>
    <rect x="2" y="26" width="40" height="6" fill="#004DFF"/>
    <rect x="2" y="32" width="40" height="6" fill="#750787"/>
  </g>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Stop discrimination stop sign and scales">
  <!-- Transparent background, stop sign with tiny scales inside -->
  <g transform="translate(32 30)">
    <!-- octagon -->
    <path d="M0 -10 L7 -7 L10 0 L7 7 L0 10 L-7 7 L-10 0 L-7 -7 Z" fill="#dc2626"/>
    <!-- scales -->
    <line x1="0" y1="-6" x2="0" y2="4" stroke="#f9fafb" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-4" y1="-3" x2="4" y2="-3" stroke="#f9fafb" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="-4" cy="1" r="2" fill="none" stroke="#f9fafb" stroke-width="1"/>
    <circle cx="4" cy="1" r="2" fill="none" stroke="#f9fafb" stroke-width="1"/>
  </g>
</svg>

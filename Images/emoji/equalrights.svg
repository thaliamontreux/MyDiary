    <rect x="-12" y="-8" width="24" height="16" rx="5" ry="5" fill="#020617"/>
    <rect x="-7" y="-3" width="14" height="2.6" rx="1.3" fill="#e5e7eb"/>
    <rect x="-7" y="2" width="14" height="2.6" rx="1.3" fill="#e5e7eb"/>
  </g>
  <g transform="translate(32 40)">
    <line x1="0" y1="-4" x2="0" y2="4" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
    <line x1="-6" y1="-2" x2="6" y2="-2" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Queer joy smiling star and rainbow confetti">
  <!-- Transparent background, smiling star with rainbow confetti -->
  <g transform="translate(32 26)">
    <polygon points="0,-10 3,-3 11,-2 5,2 7,10 0,6 -7,10 -5,2 -11,-2 -3,-3" fill="#facc15"/>
    <!-- face -->
    <circle cx="-3" cy="-2" r="1.3" fill="#0f172a"/>
    <circle cx="3" cy="-2" r="1.3" fill="#0f172a"/>
    <path d="M-2,2 Q0,4 2,2" fill="none" stroke="#0f172a" stroke-width="1.4" stroke-linecap="round"/>
  </g>
  <!-- confetti arcs -->
  <g transform="translate(32 40)">
    <path d="M-12 0 A12 8 0 0 1 12 0" fill="none" stroke="#E40303" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M-10 3 A10 6 0 0 1 10 3" fill="none" stroke="#22c55e" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M-8 6 A8 4 0 0 1 8 6" fill="none" stroke="#3b82f6" stroke-width="2.2" stroke-linecap="round"/>
  </g>
</svg>

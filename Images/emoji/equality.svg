<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Equality equal sign with rainbow">
  <!-- Transparent background, equal sign inside rounded square with rainbow accent -->
  <g transform="translate(32 32)">
    <rect x="-12" y="-10" width="24" height="20" rx="6" ry="6" fill="#020617"/>
    <rect x="-8" y="-4" width="16" height="2.6" rx="1.3" fill="#e5e7eb"/>
    <rect x="-8" y="1" width="16" height="2.6" rx="1.3" fill="#e5e7eb"/>
    <!-- small rainbow corner -->
    <rect x="4" y="6" width="6" height="2" fill="#E40303"/>
    <rect x="4" y="4" width="6" height="2" fill="#22c55e"/>
  </g>
</svg>

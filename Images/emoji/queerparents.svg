<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Queer parents two adults and child with heart">
  <!-- Transparent background, two adults and child with heart above -->
  <g transform="translate(32 36)">
    <!-- adults -->
    <circle cx="-6" cy="-10" r="3" fill="#e5e7eb"/>
    <circle cx="6" cy="-10" r="3" fill="#e5e7eb"/>
    <path d="M-10 -2 C-8 -8 -4 -8 -2 -2 L-2 8 L-10 8 Z" fill="#111827"/>
    <path d="M10 -2 C8 -8 4 -8 2 -2 L2 8 L10 8 Z" fill="#111827"/>
    <!-- child -->
    <circle cx="0" cy="-6" r="2.4" fill="#e5e7eb"/>
    <path d="M-3 0 C-2 -4 2 -4 3 0 L3 8 L-3 8 Z" fill="#1f2937"/>
  </g>
  <!-- heart above family -->
  <g transform="translate(32 20)">
    <path d="M0 6  -3 3c-2-2-3-5-1-7 1-2 4-2 6 0 2-2 5-2 6 0 2 2 1 5-1 7z" fill="#f97316"/>
  </g>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Queer community people over rainbow">
  <!-- Transparent background, three people silhouettes over a rainbow arc -->
  <g transform="translate(32 36)">
    <!-- rainbow arc base -->
    <path d="M-18 6 A18 18 0 0 1 18 6" fill="none" stroke="#E40303" stroke-width="4" stroke-linecap="round"/>
    <path d="M-16 4 A16 16 0 0 1 16 4" fill="none" stroke="#FF8C00" stroke-width="4" stroke-linecap="round"/>
    <path d="M-14 2 A14 14 0 0 1 14 2" fill="none" stroke="#FFED00" stroke-width="4" stroke-linecap="round"/>
    <path d="M-12 0 A12 12 0 0 1 12 0" fill="none" stroke="#008026" stroke-width="4" stroke-linecap="round"/>
    <path d="M-10 -2 A10 10 0 0 1 10 -2" fill="none" stroke="#004DFF" stroke-width="4" stroke-linecap="round"/>
    <path d="M-8 -4 A8 8 0 0 1 8 -4" fill="none" stroke="#750787" stroke-width="4" stroke-linecap="round"/>
    <!-- three heads -->
    <circle cx="-10" cy="-14" r="3.5" fill="#e5e7eb"/>
    <circle cx="0" cy="-16" r="4" fill="#e5e7eb"/>
    <circle cx="10" cy="-14" r="3.5" fill="#e5e7eb"/>
    <!-- shoulders -->
    <path d="M-14 -8 C-10 -11 -6 -11 -2 -8" fill="#e5e7eb" fill-opacity="0.9"/>
    <path d="M-2 -8 C2 -11 6 -11 10 -8" fill="#e5e7eb" fill-opacity="0.9"/>
  </g>
</svg>

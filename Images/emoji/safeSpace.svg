    <!-- roof -->
    <polygon points="0,-14 12,-4 -12,-4" fill="#E40303"/>
    <polygon points="0,-12 10,-4 -10,-4" fill="#22c55e" fill-opacity="0.9"/>
    <!-- house body -->
    <rect x="-10" y="-4" width="20" height="14" rx="2" ry="2" fill="#0f172a"/>
    <!-- heart inside -->
    <path d="M0 2c-2-3-6-3-8 0-2 3-1 6 1 8l7 6 7-6c2-2 3-5 1-8-2-3-6-3-8 0z" fill="#f97316"/>
  </g>
</svg>

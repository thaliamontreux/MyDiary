<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Coming out door with rainbow light">
  <!-- Transparent background, door opening with rainbow light spilling out -->
  <g transform="translate(22 14)">
    <!-- door frame -->
    <rect x="0" y="0" width="20" height="32" rx="3" ry="3" fill="#0f172a" fill-opacity="0.85"/>
    <!-- open door -->
    <polygon points="2,2 12,4 12,30 2,28" fill="#1f2937"/>
    <circle cx="5" cy="16" r="1" fill="#e5e7eb"/>
  </g>
  <!-- rainbow beam -->
  <g transform="translate(42 26)">
    <polygon points="0,-6 16,-10 16,-8 0,-4" fill="#E40303"/>
    <polygon points="0,-4 16,-8 16,-6 0,-2" fill="#FF8C00"/>
    <polygon points="0,-2 16,-6 16,-4 0,0" fill="#FFED00"/>
    <polygon points="0,0 16,-4 16,-2 0,2" fill="#008026"/>
    <polygon points="0,2 16,-2 16,0 0,4" fill="#004DFF"/>
    <polygon points="0,4 16,0 16,2 0,6" fill="#750787"/>
  </g>
</svg>

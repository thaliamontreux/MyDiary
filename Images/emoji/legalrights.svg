<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Legal rights gavel and document">
  <!-- Transparent background, gavel over document -->
  <g transform="translate(26 30)">
    <rect x="-7" y="-8" width="14" height="16" rx="2" ry="2" fill="#020617"/>
    <line x1="-4" y1="-4" x2="4" y2="-4" stroke="#e5e7eb" stroke-width="1.2"/>
    <line x1="-4" y1="-1" x2="2" y2="-1" stroke="#e5e7eb" stroke-width="1.2"/>
  </g>
  <g transform="translate(40 36)">
    <!-- gavel head -->
    <rect x="-2" y="-4" width="8" height="4" rx="1" ry="1" fill="#f97316"/>
    <!-- handle -->
    <rect x="2" y="-1" width="8" height="2" rx="1" ry="1" fill="#92400e"/>
  </g>
</svg>
